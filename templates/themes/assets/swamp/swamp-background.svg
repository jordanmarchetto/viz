  <radialGradient id="light" cx="52%" cy="22%" r="58%"><stop stop-color="#e5dc9b" stop-opacity=".52"/><stop offset=".36" stop-color="#9ba16a" stop-opacity=".2"/><stop offset="1" stop-color="#101611" stop-opacity="0"/></radialGradient>
  <linearGradient id="ray" x1=".5" y1="0" x2=".5" y2="1"><stop stop-color="#f5eab7" stop-opacity=".27"/><stop offset="1" stop-color="#d5cf86" stop-opacity="0"/></linearGradient>
  <linearGradient id="trunk" x2="1"><stop stop-color="#171511"/><stop offset=".45" stop-color="#3b3326"/><stop offset=".7" stop-color="#211e18"/><stop offset="1" stop-color="#0d100d"/></linearGradient>
